[project]
name = "Minecraft_QQBot"
version = "2.0.2"
description = "一款与 Minecraft 互通的 Nonebot2 机器人。"
readme = "README.md"
requires-python = ">=3.8, <4.0"
dependencies = [
    "httpx>=0.28.1",
    "nonebot2[fastapi]>=2.4.4",
    "psutil>=7.0.0",
    "nonebot-adapter-onebot>=2.4.6",
    "Pillow>=10.0.0",
    "langchain>=0.2.0",
    "langchain-ollama>=0.2.0",
    "nb-cli"
]

[tool.nonebot]
plugin_dirs = ["BotServer/Plugins"]
builtin_plugins = []
[tool.nonebot.plugins]
"@local" = []


[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

# 本目录为部署目录而非 Python 库，禁止 setuptools 自动发现包
[tool.setuptools]
py-modules = []
